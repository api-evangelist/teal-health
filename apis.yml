name: Teal Health
description: "Teal Health, Inc. is a women's health company behind the Teal Wand, the first and only FDA-approved at-home self-collection device for cervical cancer screening in the United States. Its end-to-end telehealth service pairs the self-collection kit with virtual Teal medical providers who prescribe the kit, review Roche cobas HPV lab results, and support patients aged 25-65 throughout the screening experience. Now available in all 50 states, Teal Health runs a HIPAA-compliant direct-to-consumer telehealth platform and is a consumer of third-party healthcare APIs (Healthie for scheduling/telehealth, Candid for billing) rather than a publisher of a public developer API."
